<title>FermentLog Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* FermentLog Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Written for AMS FermentLog 6.7 (build 10). Update this tour in the release that changes a taught screen. */
:root {
  --bg: #FAF6F0; --panel: #FFFFFF; --fg: #2C2620; --muted: #6F655A; --line: #ECE3D6;
  --accent: #B8551A; --accent-soft: #FBE9DC; --accent-btn: #C2561A; --good: #2F7A41; --good-soft: #E3F4E8; --warn: #C2410C;
  --shadow: 0 18px 40px rgba(44,38,32,.2);
  --pbg:#FAF6F0; --pcard:#FFFFFF; --pink:#2C2620; --pmuted:#8A7F72; --pline:#ECE3D6; --pfield:rgba(120,120,128,.14);
  --brand:#E8722C; --brandink:#B8551A; --hero:#DC6520; --jfill:#E8722C; --ok:#4A9D5B; --prob:#D1495B; --fridge:#3A7CA5;
  --bake:#A9751C; --bakefill:#9A6816; --rec:#6B46A8; --recfill:#6B46A8; --ins:#1E7F8F; --insfill:#1E7F8F; --setc:#66788C; --setfill:#5A6C80; --srch:#4F6490;
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#1A1713; --panel:#241F1A; --fg:#F0E9DF; --muted:#A89B8C; --line:#38302A;
  --accent:#F5A367; --accent-soft:#3A2517; --accent-btn:#D9651F; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#1A1713; --pcard:#241F1A; --pink:#F0E9DF; --pmuted:#A89B8C; --pline:#38302A; --pfield:rgba(120,120,128,.3);
  --brand:#F0873E; --brandink:#F5A367; --hero:#C65A1B; --jfill:#D9651F; --ok:#5FB470; --prob:#E5677A; --fridge:#7DB7DC;
  --bake:#E0AE4F; --bakefill:#A97B22; --rec:#C7AEF0; --recfill:#7A56BA; --ins:#55BCCB; --insfill:#238FA0; --setc:#A4B3C4; --setfill:#6B7D91; --srch:#9DB1DD;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#1A1713; --panel:#241F1A; --fg:#F0E9DF; --muted:#A89B8C; --line:#38302A;
  --accent:#F5A367; --accent-soft:#3A2517; --accent-btn:#D9651F; --good:#86EFAC; --good-soft:#15301F; --warn:#FDBA74;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --pbg:#1A1713; --pcard:#241F1A; --pink:#F0E9DF; --pmuted:#A89B8C; --pline:#38302A; --pfield:rgba(120,120,128,.3);
  --brand:#F0873E; --brandink:#F5A367; --hero:#C65A1B; --jfill:#D9651F; --ok:#5FB470; --prob:#E5677A; --fridge:#7DB7DC;
  --bake:#E0AE4F; --bakefill:#A97B22; --rec:#C7AEF0; --recfill:#7A56BA; --ins:#55BCCB; --insfill:#238FA0; --setc:#A4B3C4; --setfill:#6B7D91; --srch:#9DB1DD;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: #E8722C; color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent-btn); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: var(--accent-btn); border-color: var(--accent-btn); color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
:where(.stage button) { font: inherit; color: inherit }
:where(.stage input, .stage select) { font: inherit; color: var(--pink); -webkit-user-select: text; user-select: text }
.fl-sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: linear-gradient(var(--pbg) 70%, transparent) }
.fl-bat { width: 25px; height: 12px; border: 1.5px solid var(--pink); border-radius: 4px; position: relative; opacity: .8 }
.fl-bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink); border-radius: 2px }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 46px 12px 84px; scrollbar-width: none }
.scr::-webkit-scrollbar { display: none }
.fl-sp { flex: 1; min-width: 0 }
.fl-mut { color: var(--pmuted) }

/* Tab bar: five tabs, like the app */
.fl-tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--pcard); border-top: 1px solid var(--pline); display: flex; align-items: flex-start; padding-top: 6px; z-index: 30 }
.fl-tabs button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--pmuted); cursor: pointer; padding: 0 }
.fl-tabs button svg { width: 24px; height: 24px }
.fl-tabs button.on { font-weight: 600 }

/* Navigation */
.fl-nav { display: flex; align-items: center; min-height: 40px; gap: 8px }
.fl-nb { display: flex; align-items: center; border: 0; background: none; color: var(--brandink); font-size: 16px; padding: 4px 0; cursor: pointer; min-height: 40px }
.fl-nb svg { width: 20px; height: 20px }
.fl-nlink { display: flex; align-items: center; gap: 4px; border: 0; background: none; font-size: 16px; cursor: pointer; padding: 4px 2px; font-weight: 500 }
.fl-nlink svg { width: 18px; height: 18px }
.fl-title { margin: 0 0 6px; font-size: 32px; line-height: 1.12; font-weight: 700 }
.fl-ntitle { flex: 1; text-align: center; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fl-seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--pfield) }
.fl-seg button { border: 0; background: none; border-radius: 7px; min-height: 28px; padding: 0 14px; font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap }
.fl-seg button.on { background: var(--pcard); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15) }
.fl-cap { color: var(--pmuted); font-size: 12px; margin: 4px 0 }
.fl-h { font-size: 17px; font-weight: 600; margin: 8px 0 5px; display: flex; gap: 6px; align-items: baseline }
.fl-h small { font-size: 15px; font-weight: 400; color: var(--pmuted) }

/* Tiles, pills, tags */
.fl-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 }
.fl-tile { border: 0; border-radius: 12px; padding: 6px 9px; text-align: left; cursor: pointer; background: rgba(232,114,44,.12); position: relative }
.fl-tile b { display: block; font-size: 22px; font-weight: 800; line-height: 1.2 }
.fl-tile small { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; opacity: .9 }
.fl-tile.sel { box-shadow: 0 0 0 2px var(--pbg), 0 0 0 4px currentColor }
.fl-pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px }
.fl-tag { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 5px }
.fl-find { display: flex; align-items: center; gap: 6px; background: var(--pcard); border: 1px solid var(--pline); border-radius: 9px; padding: 6px 8px; flex: 1; min-width: 0 }
.fl-find svg { width: 16px; height: 16px; color: var(--pmuted) }
.fl-find input { border: 0; background: none; flex: 1; min-width: 0; font-size: 15px; outline: none }
.fl-find button { border: 0; background: none; font-weight: 600; color: var(--brandink); cursor: pointer; font-size: 14px }
.fl-qb { border: 0; border-radius: 10px; min-height: 32px; padding: 6px 12px; font-weight: 600; font-size: 15px; cursor: pointer }
.fl-pb { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 0; border-radius: 10px; min-height: 36px; padding: 8px 14px; font-weight: 600; font-size: 16px; color: #fff; cursor: pointer }
.fl-pb:disabled { opacity: .55; cursor: default }
.fl-pb svg { width: 18px; height: 18px }
.fl-due { background: rgba(232,114,44,.12); border-radius: 10px; padding: 8px; margin: 6px 0 }
.fl-due b { display: block; font-size: 15px; color: var(--brandink) }
.fl-due small { color: var(--pmuted); font-size: 12px }
.fl-row { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: var(--pcard); border-radius: 14px; padding: 8px; margin: 0 0 8px; text-align: left; cursor: pointer; box-shadow: 0 3px 8px rgba(60,40,20,.08) }
.fl-thumb { width: 48px; height: 48px; border-radius: 8px; display: grid; place-items: center; flex: none; background: rgba(232,114,44,.13); color: var(--brand) }
.fl-thumb svg { width: 28px; height: 28px }
.fl-row b { display: block; font-size: 16px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.fl-line2 { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--pmuted); margin: 3px 0 }
.fl-line2 .st { color: var(--brand); letter-spacing: 1px }
.fl-tags { display: flex; gap: 4px; flex-wrap: wrap }
.fl-card { background: var(--pcard); border-radius: 14px; padding: 10px; margin: 8px 0; box-shadow: 0 3px 8px rgba(60,40,20,.08) }
.fl-card h3 { margin: 0 0 6px; font-size: 17px; font-weight: 600; color: var(--brandink) }
.fl-card h3 small { font-size: 12px; font-weight: 400; color: var(--pmuted); margin-left: 6px }

/* Jar page */
.fl-hero { background: var(--hero); color: #fff; border-radius: 16px; padding: 12px; margin: 4px 0 8px; display: flex; gap: 12px; align-items: center }
.fl-hero.rec { background: var(--recfill); display: block } .fl-hero.ins { background: var(--insfill); display: block } .fl-hero.bake { background: var(--bakefill) }
.fl-hpic { width: 60px; height: 76px; border-radius: 10px; background: rgba(255,255,255,.17); display: grid; place-items: center; flex: none; border: 1.5px solid rgba(255,255,255,.45) }
.fl-hpic svg { width: 40px; height: 40px }
.fl-hero h2 { margin: 0; font-size: 20px; line-height: 1.2 }
.fl-hero .big { font-size: 28px; font-weight: 800; line-height: 1.1 }
.fl-hero .soft { font-size: 12px; opacity: .88 }
.fl-hero .fl-pill { background: rgba(255,255,255,.22); color: #fff }
.fl-pl { height: 6px; border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; margin: 5px 0 2px } .fl-pl i { display: block; height: 100%; background: #fff }
.fl-ftiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0 }
.fl-ft { background: rgba(232,114,44,.1); border-radius: 10px; padding: 5px 8px } .fl-ft small { display: block; font-size: 11px; color: var(--pmuted) } .fl-ft b { font-size: 15px }
.fl-burp { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.fl-burp .rd { font-size: 12.5px; color: var(--pmuted) }
.fl-sw { display: flex; align-items: center; gap: 8px; font-size: 15px }
.fl-tg { position: relative; width: 44px; height: 26px; border-radius: 13px; background: rgba(120,120,128,.4); flex: none; border: 0; cursor: pointer; margin-left: auto }
.fl-tg::after { content: ""; position: absolute; left: 2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff }
.fl-tg.on { background: var(--brand) } .fl-tg.on::after { left: 20px }
.fl-tg.set.on { background: var(--setc) }
.fl-todo { display: flex; gap: 8px; width: 100%; border: 0; background: none; padding: 4px 0; text-align: left; cursor: pointer }
.fl-box { width: 22px; height: 22px; border-radius: 50%; border: 1.9px solid var(--pmuted); flex: none; display: grid; place-items: center; margin-top: 1px }
.fl-box.on { border-color: var(--ok); background: rgba(74,157,91,.16); color: var(--ok) } .fl-box svg { width: 13px; height: 13px; stroke-width: 2.6 }
.fl-todo b { display: block; font-size: 14px } .fl-todo small { display: block; font-size: 12px; color: var(--pmuted) } .fl-todo small.dn { color: var(--ok) }
.fl-tline { display: block; height: 6px; border-radius: 3px; background: rgba(74,157,91,.2); overflow: hidden; width: 140px } .fl-tline i { display: block; height: 100%; background: var(--ok) }
.fl-dayh { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--brandink); margin: 8px 0 2px }
.fl-tl { position: relative; display: flex; align-items: flex-start; padding: 3px 0; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; font-size: 14px }
.fl-tl .tm { width: 42px; font-size: 12px; color: var(--pmuted); font-variant-numeric: tabular-nums; flex: none; padding-top: 1px }
.fl-tl .dt { width: 22px; flex: none; display: grid; place-items: center; height: 18px; position: relative; z-index: 1 }
.fl-tl .dt i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 1.5px var(--pcard) }
.fl-tl .dt i.t { width: 9px; height: 9px; background: var(--pcard); border: 2.5px solid var(--ok); box-shadow: none }
.fl-tl:not(.last)::before { content: ""; position: absolute; left: 52px; top: 14px; bottom: -8px; width: 2px; background: rgba(232,114,44,.28) }
.fl-tl em { font-style: normal; font-weight: 700; color: var(--ok); margin-right: 4px }
.fl-pics { display: flex; gap: 4px; padding: 0 0 4px 64px }
.fl-pic { width: 60px; height: 60px; border-radius: 8px; border: 0; background: linear-gradient(135deg, rgba(232,114,44,.3), rgba(74,157,91,.3)); color: var(--brand); display: grid; place-items: center; cursor: pointer; padding: 0 }
.fl-pic svg { width: 26px; height: 26px }
.fl-hr { border: 0; border-top: 1px solid var(--pline); margin: 8px 0 }
.fl-add { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.fl-when { font-size: 13px; color: var(--pmuted) }
.fl-box2 { width: 100%; min-height: 54px; border: 1px solid var(--pline); border-radius: 9px; background: var(--pcard); padding: 8px; font-size: 15px; outline-offset: 1px }
.fl-pend { display: flex; gap: 8px; margin: 6px 0 } .fl-pend div { text-align: center; font-size: 11px } .fl-pend button { border: 0; background: none; color: var(--prob); font-weight: 600; font-size: 12px; cursor: pointer }
.fl-verdict { border-radius: 8px; padding: 5px 10px; font-weight: 700; font-size: 14px; margin: 2px 0 6px }
.fl-bar { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 3px 0 } .fl-bar .nm { width: 70px } .fl-bar .st { color: var(--brand); width: 60px; letter-spacing: 1px } .fl-bar .tr { flex: 1; height: 6px; border-radius: 3px; background: rgba(232,114,44,.16); overflow: hidden } .fl-bar .tr i { display: block; height: 100%; background: var(--brand) }
.fl-acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 }

/* Forms and settings lists */
.fl-lh { font-size: 17px; font-weight: 600; margin: 12px 4px 5px }
.fl-lst { background: var(--pcard); border-radius: 12px; overflow: hidden; margin: 0 0 6px }
.fl-lrow { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 4px 14px; font-size: 16px; width: 100%; border: 0; background: none; text-align: left }
.fl-lrow + .fl-lrow { border-top: 1px solid var(--pline) }
button.fl-lrow { cursor: pointer }
.fl-lrow .v { margin-left: auto; color: var(--pmuted); font-variant-numeric: tabular-nums }
.fl-lrow input[type=text], .fl-lrow input.num, .fl-lrow select { margin-left: auto; text-align: right; border: 0; background: var(--pfield); border-radius: 7px; padding: 5px 8px; font-size: 16px; max-width: 170px; min-width: 0 }
.fl-lrow input.name { text-align: left; margin-left: 0; width: 100%; max-width: none }
.fl-nt { font-size: 12.5px; color: var(--pmuted); margin: 2px 14px 8px; line-height: 1.3 }
.fl-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px }
.fl-chip { border: 1.5px solid var(--pline); background: var(--pfield); border-radius: 14px; padding: 4px 10px; font-size: 14px; cursor: pointer }
.fl-chip.on { border-color: var(--brand); background: none; color: var(--brandink); font-weight: 600 }
.fl-ok { color: var(--ok); font-weight: 600 }
.fl-play { border: 0; border-radius: 10px; background: rgba(90,108,128,.16); color: var(--setc); font-weight: 600; padding: 5px 12px; cursor: pointer; font-size: 15px }
.fl-sound small { display: block; font-size: 12px; color: var(--pmuted) }
.fl-lrow .pill { background: rgba(102,120,140,.18); color: var(--setc); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px }
.fl-star { border: 0; background: none; font-size: 22px; color: var(--brand); cursor: pointer; padding: 0 1px }
.fl-ribbon { display: flex; gap: 3px; margin: 6px 0 4px } .fl-ribbon span { height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--recfill) } .fl-ribbon span.w { background: rgba(107,70,168,.28); color: var(--rec) }
.fl-step { display: flex; gap: 8px; padding: 5px 0 } .fl-step .n { width: 24px; height: 24px; border-radius: 50%; background: var(--recfill); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none } .fl-step b { font-size: 14px } .fl-step small { display: block; font-size: 12px; color: var(--pmuted) }
.fl-dots { position: relative; height: 80px; background: rgba(30,127,143,.07); border-radius: 10px; margin: 4px 0 }
.fl-dots i { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--ins) }
.fl-dots u { position: absolute; top: 0; bottom: 0; background: rgba(30,127,143,.16) }

/* Sheets, overlays */

/* ---------- Stage ---------- */
function renderStage() {
  const st = document.getElementById('stage');
  const pk = () => S.tab + ':' + (S.page || '') + (S.view || '');
  const keyOf = e => e.closest('.fl-sheet') ? 'sh:' + S.sheet : 'pg:' + pk(), prevKeys = renderStage.keys || {};
  const scrolls = renderStage.scrolls = renderStage.scrolls || {};
  st.querySelectorAll('[data-keep]').forEach(e => { if (e.dataset.k) scrolls[e.dataset.k] = e.scrollTop; });
  const ae = document.activeElement, inId = ae && st.contains(ae) ? ae.dataset.in : null, sel = inId && ae.selectionStart != null ? [ae.selectionStart, ae.selectionEnd] : null;
  let body;
  if (S.tab === 'home') body = S.page === 'jar' ? jarHTML() : S.page === 'newjar' ? newJarHTML() : homeHTML();
  else if (S.tab === 'recipes') body = S.page === 'recipe' ? recipeHTML() : S.page === 'newjar' ? newJarHTML() : recipesHTML();
  else if (S.tab === 'new') body = S.page === 'newjar' ? newJarHTML() : S.page === 'jar' ? jarHTML() : newHTML();
  else if (S.tab === 'insights') body = insightsHTML();
  else body = settingsHTML();
  const over = (S.sheet === 'outcome' ? outcomeSheet() : '') + (S.story != null ? storyHTML() : '');
  const undo = S.undo ? `<div class="fl-undo" data-t="undo-bar"><span class="fl-sp">${esc(S.undo.label)}</span><button data-act="undo" data-t="undo-btn">Undo</button></div>` : '';
  st.innerHTML = `<div class="fl-sbar"><span>9:41</span><span class="fl-bat"></span></div>${body}${undo}${over}${S.toast ? `<div class="fl-toast">${esc(S.toast)}</div>` : ''}`;
  renderStage.keys = {};
  st.querySelectorAll('[data-keep]').forEach(e => { const k = keyOf(e); e.dataset.k = k; renderStage.keys[k] = 1; e.scrollTop = prevKeys[k] ? (scrolls[k] || 0) : 0; });
  if (inId) { const nf = st.querySelector(`[data-in="${inId}"]`); if (nf) { nf.focus(); try { if (sel) nf.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  markTarget();
}
let toastH = null;
function toast(t) { S.toast = t; renderStage(); clearTimeout(toastH); toastH = setTimeout(() => { S.toast = ''; renderStage(); }, 2400); }
const soon = () => toast('Practice copy: not drawn here.');

/* The Undo bar: 4 seconds, as in the app. In practice steps it comes back so there is time to try. */
let undoSeq = 0;
function startUndo(label, restore, practice) {
  const id = ++undoSeq; S.undo = { id, label, restore, practice: !!practice };
  later(() => {
    if (!S.undo || S.undo.id !== id) return;
    if (S.undo.practice && !solved) { startUndo(label, restore, true); toast('The bar lasts 4 seconds and has gone. Here it is again, for practice.'); }
    else { S.undo = null; renderStage(); }
  }, 4000);
  renderStage();
}

/* ---------- Actions inside the pretend iPhone ---------- */
const stage = document.getElementById('stage');
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
function onField(ev) {
  const k = ev.target.dataset.in; if (!k) return; const v = ev.target.value;
  if (k === 'find') { S.find = v; renderStage(); emit('find', v); }
  else if (k === 'tl') { S.tx = v; renderStage(); if (v.trim()) emit('tl-typed'); }
  else if (k === 'njname') S.nj.name = v;
  else if (k === 'salt') { S.nj.salt = num(v); S.nj.saltRaw = v; renderStage(); emit('salt', S.nj.salt); }
  else if (k === 'veg') { S.nj.veg = v; renderStage(); emit('veg', v); }
  else if (k === 'lid') { S.nj.lid = v; S.nj.burp = null; renderStage(); emit('lid', v); }
}
stage.addEventListener('input', onField);
stage.addEventListener('change', ev => { if (ev.target.tagName === 'SELECT') onField(ev); });
stage.addEventListener('keydown', ev => { if (ev.key !== 'Enter') return; const k = ev.target.dataset && ev.target.dataset.in; if (k && ev.target.tagName === 'INPUT') ev.target.blur(); });
stage.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  act(el.dataset.act, el.dataset.id, el);
});
const nowTime = '09:40';
function act(a, id, el) {
  switch (a) {
    case 'soon': soon(); break;
    case 'tab': { if (S.tab !== id) { S.page = null; S.sheet = null; } S.tab = id; renderStage(); emit('tab', id); break; }
    case 'home-view': S.view = id; renderStage(); emit('home-view', id); break;
    case 'filter': S.filter = S.filter === id ? null : id; renderStage(); emit('filter', S.filter); break;
    case 'show-all': S.filter = null; renderStage(); emit('filter', null); break;
    case 'find-clear': S.find = ''; renderStage(); break;
    case 'sort': S.sort = id; renderStage(); emit('sort', id); break;
    case 'open-jar': S.openId = id; S.page = 'jar'; S.kind = 'did'; S.tx = ''; S.pend = 0; renderStage(); emit('open-jar', id); break;
    case 'page-back': S.page = null; renderStage(); break;
    case 'burped': { const j = J(S.openId), old = { lines: j.lines.slice(), lastBurp: j.lastBurp, burpN: j.burpN };
      j.lines.push({ day: j.day, date: 'Wed 25 Nov', time: nowTime, kind: 'did', text: 'Burped the jar', pics: 0 }); j.lastBurp = nowTime; j.burpN = (j.burpN || 0) + 1;
      startUndo('Burp logged ' + nowTime, () => { Object.assign(j, old); }, false); emit('burped'); break; }
    case 'undo': if (S.undo) { S.undo.restore(); S.undo = null; renderStage(); emit('undo'); } break;
    case 'jar-alarm': { const j = J(S.openId); j.burp = !j.burp; renderStage(); emit('jar-alarm', j.burp); break; }
    case 'tick': { const j = J(S.openId), p = j.plan[+id]; if (!p.done) { p.done = nowTime; j.lines.push({ day: j.day, date: 'Wed 25 Nov', time: nowTime, kind: 'did', text: p.t, pics: 0 }); renderStage(); emit('tick', +id); } break; }
    case 'kind': S.kind = id; renderStage(); emit('kind', id); break;
    case 'add-pics': if (S.pend < 6) S.pend++; renderStage(); emit('pics', S.pend); break;
    case 'pend-remove': S.pend = Math.max(0, S.pend - 1); renderStage(); break;
    case 'tl-add': { const j = J(S.openId); if (!(S.tx.trim() || S.pend)) break;
      const parts = S.kind === 'did' ? S.tx.split('\n').map(x => x.replace(/^\s*(\d+[.)]|[-\u2022])\s+/, '').trim()).filter(Boolean) : [S.tx.trim()];
      if (!parts.length) parts.push('');
      parts.forEach((t, i) => j.lines.push({ day: j.day, date: 'Wed 25 Nov', time: nowTime, kind: S.kind, text: t, pics: i === parts.length - 1 ? S.pend : 0 }));
      const d = { kind: S.kind, text: S.tx.trim(), pics: S.pend }; S.tx = ''; S.pend = 0; renderStage(); emit('tl-added', d); break; }
    case 'story-open': S.story = 0; { const j = J(S.openId), withPics = tlSorted(j), want = withPics[+id]; let n = 0, idx = 0; withPics.forEach(l => { if (l.pics) { if (l === want) idx = n; n += l.pics; } }); S.story = idx; } renderStage(); emit('story-open'); break;
    case 'story-close': S.story = null; renderStage(); emit('story-closed'); break;
    case 'to-fridge': { const j = J(S.openId); j.status = 'fridge'; j.fridgeOn = 'Wed 25 Nov'; j.due = false; renderStage(); emit('fridge'); break; }
    case 'outcome-open': S.sheet = 'outcome'; renderStage(); emit('sheet-open'); break;
    case 'star': { const [k, n] = id.split('-'); S.oc[k] = +n; renderStage(); emit('star', id); break; }
    case 'sheet-cancel': S.sheet = null; renderStage(); break;
    case 'outcome-save': { const j = J(S.openId), o = S.oc; j.outcome = { ok: true, taste: o.taste, sour: o.sour, crunch: o.crunch, overall: o.overall }; j.status = 'done'; j.stars = o.overall; S.sheet = null; renderStage(); emit('outcome-saved'); break; }
    case 'new-jar-open': S.nj = START().nj; S.page = 'newjar'; if (S.tab !== 'home' && S.tab !== 'new') S.tab = 'home'; renderStage(); emit('newjar-open'); break;
    case 'nj-burp': { const on = S.nj.burp != null ? S.nj.burp : S.nj.lid === 'Plain lid'; S.nj.burp = !on; renderStage(); break; }
    case 'nj-cancel': S.page = null; renderStage(); break;
    case 'nj-save': { const n = S.nj; const id = 'j' + Object.keys(S.jars).length;
      S.jars[id] = { id, name: n.name.trim() || n.veg, veg: n.veg, form: n.form, status: 'fermenting', day: 1, start: 'Wed 25 Nov', sn: 25, salt: n.salt, water: n.water, room: 20, lid: n.lid, weight: 'Glass weight', burp: n.burp != null ? n.burp : n.lid === 'Plain lid', due: false, next: 'Taste test Sat 28 Nov' + DOT + 'in 3 days', share: 0, spices: [], plan: [], lines: [], stars: 0, outcome: null };
      S.openId = id; S.page = 'jar'; S.tab = 'home'; renderStage(); emit('jar-saved'); break; }
    case 'open-recipe': S.rid = id; S.page = 'recipe'; renderStage(); emit('open-recipe', id); break;
    case 'recipe-jar': S.nj = Object.assign(START().nj, { name: 'Quick sauerkraut', veg: 'Cabbage', form: 'Shredded', note: 'From recipe: Quick sauerkraut', recipe: 'kraut' }); S.page = 'newjar'; renderStage(); emit('recipe-jar'); break;
    case 'cfg-here': S.cfg.here = !S.cfg.here; renderStage(); emit('ring-here', S.cfg.here); break;
    case 'play': S.cfg.played = +id; renderStage(); toast('Playing: ' + SOUNDS[+id - 1][0]); emit('play', +id); break;
    case 'sound-on': { const n = +id; S.cfg.off = S.cfg.off.includes(n) ? S.cfg.off.filter(x => x !== n) : S.cfg.off.concat([n]); renderStage(); emit('sound-on', { n, on: !S.cfg.off.includes(n) }); break; }
    case 'open-safety': S.page = 'safety'; renderStage(); emit('safety-open'); break;
    default: break;
  }
}

/* ---------- Tour engine (reusable) ---------- */
let ci = 0, si = 0, solved = false, targetOff = false;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
let doneChapters = new Set(JSON.parse(store.get('fermentlogtour-done') || '[]'));

function emit(name, data) {
  const st = LESSONS[ci]?.steps[si]; if (!st || solved || st.kind !== 'try') return;
  if (st.on && st.on[name]) { markTarget(st.on[name]); }
  if ((st.wait === name || st.alt === name) && (!st.when || st.when(data))) succeed(st.ok);
}
function succeed(msg) {
  solved = true; targetOff = true; const fb = document.getElementById('fb'); if (fb) { fb.textContent = '\u2713 ' + msg; fb.className = 'feedback'; }
  const nx = document.getElementById('next'); if (nx) { nx.disabled = false; nx.focus({ preventScroll: true }); }
  markTarget();
}
let curTarget = null;
function markTarget(t) {
  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray tap closed a page), point at the way back to it.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null)
    || (S.story != null ? q('story-done') : S.sheet ? q('sheet-cancel') : S.page === 'newjar' ? q('nj-cancel') : S.page ? q('page-back') : S.tab !== 'home' ? q('tab-home') : null);
  if (el) {
    el.classList.add('target');
    const sc = el.closest('.scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(), k = document.getElementById('stagebox').clientWidth / 390;
      if (r.top < s.top + 40 * k || r.bottom > s.bottom - 110 * k) sc.scrollTop += (r.top - s.top - 120 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="logo">${icon('jar')}</span><div><h1>FermentLog Tour</h1><small>Learn the app in about 20 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '\u2713' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('chevR')}<span>Now on your iPhone</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Everything here is a practice copy. Nothing changes on your iPhone, iPad or Mac. Written for FermentLog 6.7.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  const L = LESSONS[i]; if (L && L.setup) L.setup();
  renderStep();
}
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  clearTimers(); clearTimeout(toastH);
  if (st.setup) st.setup();
  S.toast = '';
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">\u00B7 ${kindName} \u00B7 step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('fermentlogtour-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ['Open FermentLog on your iPhone. On Home, tap the Fermenting tile, then "Show all". Type a few letters in the find box, then try Sort: Start date and Name.',
    'Tap "New", then "New jar". Choose a vegetable, change the salt and watch the brine line, pick "Plain lid" and read the line under Burp alarm. Press Cancel (or Save, if you really want the jar).',
    'Open a jar. Read the head card, tap Burped and then Undo in the dark bar. If it has a To do list, tick a step.',
    'In the Timeline, add a "What I did" line with a picture, then a "Taste test" line. Tap a picture to open the photo story and press Done.',
    'On a jar you are finished with, tap "Move to the fridge", then "Record outcome", give some stars and press Save. Check that the jar now sits under Done.',
    'Open Settings \u203A Burp alarm: look at the two times and "Ring on this iPhone". Under Burp sounds, tap Play on two burps and switch one off.',
    'Open Recipes, open a recipe and tap "Start a jar from this recipe" (nothing is saved until Save). Then look at Insights, and at Settings \u203A iCloud and Safety copies.'];
  let ticks = JSON.parse(store.get('fermentlogtour-real') || '[]');
  fin.innerHTML = `<h3>Now on your iPhone</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <p class="railnote">Everything here is a practice copy. Nothing changes on your iPhone, iPad or Mac.</p>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('fermentlogtour-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.story != null) { act('story-close'); return; }
    if (S.sheet) { S.sheet = null; renderStage(); return; }
    if (S.page === 'newjar') { act('nj-cancel'); return; }
  }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
