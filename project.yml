# XcodeGen spec — run tools/build.sh (it runs `xcodegen generate`), then open AMSFermentLog.xcodeproj.
# ONE target for iPhone, iPad and Mac. Native rebuild of the FermentLog web app; iCloud Drive sync.
name: AMSFermentLog
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "6.6"
    CURRENT_PROJECT_VERSION: "9"
packages:
  # The shared AMS icon hub (SVG path reader, hand-drawn icons), pinned to one commit so a hub change never arrives by surprise.
  AMSIcons:
    url: https://github.com/marsch124/AMS-Icons
    revision: 713dc601397dfb5a3c40267cc868d80b973a6572
targets:
  AMSFermentLog:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: AMSIcons
    entitlements:
      path: App/Config/AMSFermentLog.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.schabbauer.AMSFermentLog]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.schabbauer.AMSFermentLog]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.device.camera: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSFermentLog
        # iPhone AND iPad. iPad means all four orientations (upload error 90474).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: FermentLog
        CFBundleName: AMS FermentLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        # Lifestyle, NOT Food & Drink: with that category TestFlight refused every Mac install (Shopping, builds 1-4).
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: The camera takes pictures of your jars, bakes and recipes.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSUbiquitousContainers:
          iCloud.com.schabbauer.AMSFermentLog:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: FermentLog
            NSUbiquitousContainerSupportedFolderLevels: Any
  AMSFermentLogTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: AMSFermentLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSFermentLogTests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/AMSFermentLog.app/Contents/MacOS/AMSFermentLog
        "BUNDLE_LOADER[sdk=macosx*]": $(TEST_HOST)
  AMSFermentLogUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: AMSFermentLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSFermentLogUITests
        TEST_TARGET_NAME: AMSFermentLog
schemes:
  AMSFermentLog:
    build:
      targets:
        AMSFermentLog: all
    test:
      targets:
        - AMSFermentLogTests
        - AMSFermentLogUITests
